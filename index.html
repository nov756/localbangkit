<html lang="id" class="scroll-smooth">

    <meta charset="UTF-8" />

    <meta name="description" content="Platform gotong royong digital pendukung keberlanjutan UMKM lokal di sekitar kita sebagai wujud nyata pengamalan Pancasila." />
    <meta property="og:title" content="LokalBangkit - Pancasila dalam Aksi Digital" />
    <meta property="og:description" content="Platform gotong royong digital pendukung keberlanjutan UMKM lokal di sekitar kita sebagai wujud nyata pengamalan Pancasila." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      // Suppress Vite HMR WebSocket connection failure notices in iframe / sandbox environment
      window.addEventListener('error', function(e) {
        if (
          (e.filename && e.filename.indexOf('@vite/client') !== -1) ||
          (e.message && (
            e.message.indexOf('WebSocket') !== -1 ||
            e.message.indexOf('failed to connect') !== -1 ||
            e.message.indexOf('@vite/client') !== -1
          ))
        ) {
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          if (e.preventDefault) e.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason && (e.reason.message || e.reason.stack || String(e.reason));
        if (reason && (reason.indexOf('@vite/client') !== -1 || reason.indexOf('WebSocket') !== -1)) {
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          if (e.preventDefault) e.preventDefault();
        }
      });
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-red-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
